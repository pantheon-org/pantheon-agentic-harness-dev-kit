# Keeps Cargo dependencies current. Minor and patch bumps are grouped into one
# weekly PR to cut review noise; major bumps are raised individually so breaking
# changes are reviewed alone. Ported from pantheon-org/tekhne.
#
# Cargo caveat: the pantheon-agentic-harness-dev-kit crates are git dependencies
# pinned by tag in Cargo.toml. Dependabot does not reliably move a git tag, so
# bump that tag by hand when the dev-kit cuts a release.
#
# There is no github-actions entry: the scaffold renders every workflow of this
# repository, so Dependabot would have nothing left to scan (dependency_file_not_found).
# The action pins move with the scaffold releases. A repository with workflows of its
# own sets options.dependabotGithubActions = "on" in scaffold.pkl.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  cooldown:
    default-days: 7
  labels:
  - dependencies
  - rust
  commit-message:
    prefix: chore
    prefix-development: chore
    include: scope
  groups:
    cargo-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch